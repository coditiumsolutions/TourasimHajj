name: CI CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  PROJECT: TourismHajj.csproj
  PUBLISH_DIR: live_tourism

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build
        run: dotnet build ${{ env.PROJECT }} -c Release --no-restore

  publish:
    name: Publish
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish Release
        run: dotnet publish ${{ env.PROJECT }} -c Release -o ${{ env.PUBLISH_DIR }} --nologo

      - name: Apply production settings
        shell: pwsh
        env:
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING }}
        run: |
          $publishDir = "${{ env.PUBLISH_DIR }}"
          $appSettingsPath = Join-Path $publishDir "appsettings.json"

          if ([string]::IsNullOrWhiteSpace($env:SQL_CONNECTION_STRING)) {
            Write-Warning "Secret SQL_CONNECTION_STRING is not set. Published appsettings.json will keep placeholders."
          }
          else {
            $json = Get-Content $appSettingsPath -Raw | ConvertFrom-Json
            $json.ConnectionStrings.DefaultConnection = $env:SQL_CONNECTION_STRING
            $json | ConvertTo-Json -Depth 10 | Set-Content $appSettingsPath -Encoding utf8
            Write-Host "Production connection string applied."
          }

          New-Item -ItemType Directory -Force -Path (Join-Path $publishDir "logs") | Out-Null

          $webConfig = @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <location path="." inheritInChildApplications="false">
              <system.webServer>
                <handlers>
                  <add name="aspNetCore" path="*" verb="*" modules="AspNetCoreModuleV2" resourceType="Unspecified" />
                </handlers>
                <aspNetCore processPath="dotnet" arguments=".\TourismHajj.dll" stdoutLogEnabled="true" stdoutLogFile=".\logs\stdout" hostingModel="inprocess">
                  <environmentVariables>
                    <environmentVariable name="ASPNETCORE_ENVIRONMENT" value="Production" />
                  </environmentVariables>
                </aspNetCore>
              </system.webServer>
            </location>
          </configuration>
          '@
          # Remove accidental leading indentation from the here-string.
          $webConfig = ($webConfig -split "`n" | ForEach-Object { $_ -replace '^\s{10}', '' }) -join "`n"
          Set-Content (Join-Path $publishDir "web.config") -Value $webConfig.Trim() -Encoding utf8

      - name: Upload live_tourism artifact
        uses: actions/upload-artifact@v4
        with:
          name: live_tourism
          path: ${{ env.PUBLISH_DIR }}/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy Web Deploy
    needs: publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    steps:
      - name: Download live_tourism artifact
        uses: actions/download-artifact@v4
        with:
          name: live_tourism
          path: live_tourism

      - name: Verify Web Deploy secrets
        shell: pwsh
        env:
          WEBDEPLOY_COMPUTER_NAME: ${{ secrets.WEBDEPLOY_COMPUTER_NAME }}
          WEBDEPLOY_SITE_NAME: ${{ secrets.WEBDEPLOY_SITE_NAME }}
          WEBDEPLOY_USERNAME: ${{ secrets.WEBDEPLOY_USERNAME }}
          WEBDEPLOY_PASSWORD: ${{ secrets.WEBDEPLOY_PASSWORD }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:WEBDEPLOY_COMPUTER_NAME)) { $missing += 'WEBDEPLOY_COMPUTER_NAME' }
          if ([string]::IsNullOrWhiteSpace($env:WEBDEPLOY_SITE_NAME)) { $missing += 'WEBDEPLOY_SITE_NAME' }
          if ([string]::IsNullOrWhiteSpace($env:WEBDEPLOY_USERNAME)) { $missing += 'WEBDEPLOY_USERNAME' }
          if ([string]::IsNullOrWhiteSpace($env:WEBDEPLOY_PASSWORD)) { $missing += 'WEBDEPLOY_PASSWORD' }
          if ($missing.Count -gt 0) {
            throw "Missing required GitHub secrets: $($missing -join ', ')"
          }
          Write-Host "Web Deploy secrets present."

      - name: Ensure msdeploy.exe
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles}\IIS\Microsoft Web Deploy V4\msdeploy.exe",
            "${env:ProgramFiles}\IIS\Microsoft Web Deploy V3\msdeploy.exe",
            "${env:ProgramFiles(x86)}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          )
          $msdeploy = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $msdeploy) {
            Write-Host "msdeploy.exe not found; installing Web Deploy via Chocolatey..."
            choco install webdeploy -y --no-progress
            $msdeploy = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $msdeploy) { throw "msdeploy.exe still not found after install." }
          Write-Host "Using $msdeploy"
          & $msdeploy -verb:dump -source:runCommand 2>$null | Out-Null
          "MSDEPLOY_PATH=$msdeploy" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Deploy to IIS via MSDeploy
        shell: pwsh
        env:
          WEBDEPLOY_COMPUTER_NAME: ${{ secrets.WEBDEPLOY_COMPUTER_NAME }}
          WEBDEPLOY_SITE_NAME: ${{ secrets.WEBDEPLOY_SITE_NAME }}
          WEBDEPLOY_USERNAME: ${{ secrets.WEBDEPLOY_USERNAME }}
          WEBDEPLOY_PASSWORD: ${{ secrets.WEBDEPLOY_PASSWORD }}
        run: |
          $msdeploy = $env:MSDEPLOY_PATH
          if (-not $msdeploy -or -not (Test-Path $msdeploy)) {
            throw "MSDEPLOY_PATH is not set or invalid."
          }

          $sourcePath = (Resolve-Path ".\live_tourism").Path
          $site = $env:WEBDEPLOY_SITE_NAME
          $computer = $env:WEBDEPLOY_COMPUTER_NAME
          $user = $env:WEBDEPLOY_USERNAME
          $pass = $env:WEBDEPLOY_PASSWORD

          Write-Host "Deploying '$sourcePath' -> site '$site'"
          Write-Host "ComputerName: $computer"

          $dest = "contentPath=$site,ComputerName=$computer,UserName=$user,Password=$pass,AuthType=Basic,includeAcls=False"

          & $msdeploy `
            -verb:sync `
            "-source:contentPath=$sourcePath" `
            "-dest:$dest" `
            -allowUntrusted `
            -enableRule:DoNotDeleteRule `
            -enableRule:AppOffline `
            -disableLink:AppPoolExtension `
            -disableLink:ContentExtension `
            -disableLink:CertificateExtension `
            -retryAttempts:3 `
            -retryInterval:5000

          if ($LASTEXITCODE -ne 0) {
            throw "msdeploy failed with exit code $LASTEXITCODE"
          }

          Write-Host "Web Deploy completed successfully."
